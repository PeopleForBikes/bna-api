[package]
name = "migration"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { workspace = true, features = ["attributes", "tokio1"] }
sea-orm-migration = { workspace = true, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-uuid",
] }
uuid = { workspace = true, features = ["v4"] }
