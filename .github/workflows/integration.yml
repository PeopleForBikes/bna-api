name: integration

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # A release tags a commit of main, which pull requests do not run on since they
  # are squash merged.
  push:
    branches:
      - main

jobs:
  test:
    # Hurl's .deb needs libxml2, which Ubuntu 26.04 no longer provides.
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    services:
      postgres:
        image: ghcr.io/gui/pgrouting:18.1-trixie-postgis-3.6.1-pgrouting-4.0.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v2
      - name: Install HURL
        run: |
          HURL_VERSION=8.1.0
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/$HURL_VERSION/hurl_${HURL_VERSION}_amd64.deb
          sudo apt install -y ./hurl_${HURL_VERSION}_amd64.deb
      - name: Seed the database
        run: psql $DATABASE_URL < lambdas/tests/database-with-test-data.sql
      - name: Build the API server
        run: cargo build --release -p lambdas --bin axumed
      - name: Start the standalone API server
        run: >
          BNA_API_LOG_LEVEL=debug BNA_API_STANDALONE=1 cargo run --release -p lambdas
          --bin axumed &
      - run: sleep 5
      - name: Run the public smoke-tests
        working-directory: lambdas/tests
        run: just test-smoke-public localhost
      - name: Run the endpoint and scenario tests
        working-directory: lambdas/tests
        run: just test localhost
      # The coverage check and the reports also run when the suite fails: the
      # Hurl report records the failed run too.
      - name: Check the coverage of the OpenAPI specification
        if: ${{ !cancelled() }}
        working-directory: lambdas/tests
        shell: bash
        run: just coverage | tee reports/coverage.txt
      - name: Write the coverage summary
        if: ${{ !cancelled() }}
        working-directory: lambdas/tests
        shell: bash
        run: |
          {
            echo "## OpenAPI coverage"
            echo '```text'
            cat reports/coverage.txt 2>/dev/null || echo "The coverage check did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Hurl report and the coverage output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-reports
          path: lambdas/tests/reports
          if-no-files-found: warn

      # Schemathesis causes the server to crash somehow.
      # ```
      # Network Error
      #
      # Connection failed
      #
      #     Connection aborted. Remote end closed connection without response
      # ```
