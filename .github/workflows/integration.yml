name: integration

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # A release tags a commit of main, which pull requests do not run on since they
  # are squash merged.
  push:
    branches:
      - main

jobs:
  test:
    # Hurl needs libxml2, which Ubuntu 26.04 no longer provides.
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    services:
      postgres:
        image: ghcr.io/gui/pgrouting:18.1-trixie-postgis-3.6.1-pgrouting-4.0.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: github:casey/just github:Orange-OpenSource/hurl
      - name: Seed the database
        run: psql $DATABASE_URL < lambdas/tests/database-with-test-data.sql
      - name: Build the API server
        run: cargo build --release -p lambdas --bin axumed
      - name: Start the standalone API server
        run: >
          BNA_API_LOG_LEVEL=debug BNA_API_STANDALONE=1 cargo run --release -p lambdas
          --bin axumed &
      - run: sleep 5
      - name: Run the public smoke-tests
        working-directory: lambdas/tests
        run: just test-smoke-public localhost
      - name: Run the endpoint and scenario tests
        working-directory: lambdas/tests
        run: just test localhost
      # The coverage check and the reports also run when the suite fails: the
      # Hurl report records the failed run too.
      - name: Check the coverage of the OpenAPI specification
        if: ${{ !cancelled() }}
        working-directory: lambdas/tests
        shell: bash
        run: just coverage | tee reports/coverage.txt
      - name: Write the coverage summary
        if: ${{ !cancelled() }}
        working-directory: lambdas/tests
        shell: bash
        run: |
          {
            echo "## OpenAPI coverage"
            echo '```text'
            cat reports/coverage.txt 2>/dev/null || echo "The coverage check did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Hurl report and the coverage output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-reports
          path: lambdas/tests/reports
          if-no-files-found: warn

      # Schemathesis causes the server to crash somehow.
      # ```
      # Network Error
      #
      # Connection failed
      #
      #     Connection aborted. Remote end closed connection without response
      # ```
      # This will require more investigation to be run in the CI.
      # - name: Run Schemathesis
      #   run: >
      #     cd lambdas/tests &&
      #     RUST_BACKTRACE=1
      #     uv run st run
      #     --base-url http://localhost:3000/
      #     --cassette-path cassette.yaml
      #     -vvv
      #     -x
      #     --show-trace
      #     --generation-allow-x00 false
      #     --exclude-method 'POST'
      #     --exclude-method 'PATCH'
      #     ../../openapi-3.0.yaml

  # Checks that the schema specification, docs/database.dbml, matches the
  # migrations. A job of its own, so that a failure does not hide the tests.
  schema:
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    services:
      postgres:
        image: ghcr.io/gui/pgrouting:18.1-trixie-postgis-3.6.1-pgrouting-4.0.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: github:casey/just
      # The runner's PostgreSQL client is older than the server, and pg_dump
      # refuses to dump a newer server. Ubuntu's pg_dump wrapper picks the
      # version of the runner's local cluster, so the 18 binaries come first.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Check the schema specification against the migrations
        run: just dbml-check
