name: ci-rust

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push makes the running checks of the pull request obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # This is required for actions/checkout.
  contents: read

# Jobs that apply to the whole workspace.
jobs:
  # Same Rust checks as `just lint-rust` and `just test-rust`.
  ci:
    uses: PeopleForBikes/.github/.github/workflows/ci-rust.yml@main
    with:
      # Generated by progenitor.
      clippy-exclude: bnaclient

  # The shared lint-docs workflow does not install the tools of mise.toml.
  lint:
    name: lint-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.9
          # Install from mise.lock at every run, so every job checks what it runs.
          cache: false
          install_args: >-
            github:casey/just github:crate-ci/typos github:oxc-project/oxc
            github:rvben/rumdl
      - name: Check spelling and Markdown
        run: just lint-spellcheck lint-md
