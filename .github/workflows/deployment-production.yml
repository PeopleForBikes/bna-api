name: production-deployment

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  # This is required for requesting the JWT.
  id-token: write
  # This is required for actions/checkout.
  contents: read

jobs:
  deploy:
    # Pinned, so that a change to the shared workflow is reviewed here first.
    uses: PeopleForBikes/.github/.github/workflows/lambda-deploy-rust.yml@9f5369623e3bafbd2c1f1647bde247fd6b78ad7c # main 2026-11-24
    with:
      stage: production
      lambdas: axumed
      aws-region: us-west-2
      # The tag must match the workspace version.
      version-package: lambdas
      # Do not build releases from files left by an earlier job.
      use-cache: false
    secrets:
      github-role: ${{ secrets.LAMBDA_DEPLOY_GITHUB_ROLE_ARN_PRODUCTION }}
      lambda-role: ${{ secrets.BNAAPI_ROLE_ARN_PRODUCTION }}
