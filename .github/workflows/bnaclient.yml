name: bnaclient

defaults:
  run:
    working-directory: bnaclient

on:
  pull_request:
    # Everything `just generate` reads: the code the specification comes from
    # (utoipa annotations, and the entity wrappers deriving ToSchema), the
    # workspace version and the dependency versions, the specifications, the
    # client, the recipes, and the pinned progenitor.
    paths:
      - ".github/workflows/bnaclient.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bnaclient/**"
      - "entity/Cargo.toml"
      - "entity/src/**"
      - "justfile"
      - "lambdas/Cargo.toml"
      - "lambdas/src/**"
      - "mise.lock"
      - "mise.toml"
      - "openapi-3.0.yaml"
      - "openapi-3.1.yaml"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          # Install from mise.lock at every run, so every job checks what it runs.
          cache: false
          install_args: github:casey/just cargo:cargo-progenitor
      - name: Regenerate the specifications and the bnaclient
        run: just generate
      - name: Ensure there are no changes
        run: test -z "$(git status --porcelain)" || (git status; git diff; false)

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
