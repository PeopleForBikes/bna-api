name: bnaclient

defaults:
  run:
    working-directory: bnaclient

on:
  pull_request:
    # Everything `just generate` reads: the code the specification comes from
    # (utoipa annotations, and the entity wrappers deriving ToSchema), the
    # workspace version and the dependency versions, the specifications, the
    # client, the recipes, and the pinned progenitor.
    paths:
      - ".github/workflows/bnaclient.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bnaclient/**"
      - "entity/Cargo.toml"
      - "entity/src/**"
      - "justfile"
      - "lambdas/Cargo.toml"
      - "lambdas/src/**"
      - "mise.lock"
      - "mise.toml"
      - "openapi-3.0.yaml"
      - "openapi-3.1.yaml"
    types:
      - opened
      - synchronize
      - reopened

# A new push makes the running checks of the pull request obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # This is required for actions/checkout.
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.5
          # Install from mise.lock at every run, so every job checks what it runs.
          cache: false
          install_args: github:casey/just cargo:cargo-progenitor
      - name: Regenerate the specifications and the bnaclient
        run: just generate
      - name: Ensure there are no changes
        run: test -z "$(git status --porcelain)" || (git status; git diff; false)

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
