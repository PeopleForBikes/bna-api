name: lambdas

defaults:
  run:
    working-directory: lambdas

on:
  pull_request:
    paths:
      - ".github/workflows/lambdas.yml"
      - "lambdas/**"
      - "!lambdas/slumber.yml"
    types:
      - opened
      - synchronize
      - reopened

# A new push makes the running checks of the pull request obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # This is required for actions/checkout.
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The shared ci-rust workflow has a build job too.
          shared-key: lambdas-build
      - name: Install cargo lambda
        run: pip install cargo-lambda==1.9.2
      - run: cargo lambda build
