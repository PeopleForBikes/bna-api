[package]
name = "entity"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# PostgreSQL rewrites the numbers of a JSON document with all their digits, and
# only this feature reads each of them back, with the same value.
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_plain = { workspace = true }
utoipa = { workspace = true }
