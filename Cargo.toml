[package]
name = "bna-api"
version.workspace = true
edition = "2021"
publish = false

[workspace]
members = [
  "bnaclient",
  "lambdas",
  "lambdas/tests/coverage",
  "entity",
  "migration",
]

[workspace.package]
version = "1.6.0-alpha.1"

[workspace.dependencies]
async-std = "1.13.2"
aws-config = "1.13.1"
aws-sdk-s3 = "1.158.0"
axum = "0.8.9"
axum-streams = "0.30.0"
bnacore = { git = "https://github.com/PeopleForBikes/brokenspoke", rev = "daf78f2" }
chrono = "0.4.45"
color-eyre = "0.6.5"
csv = "1.4.0"
dotenvy = "0.15.7"
entity = { path = "entity" }
futures = "0.3.34"
lambda_http = "1.3.2"
once_cell = "1.21.4"
reqwest = "0.13.5"
sea-orm = "2.0.4"
sea-orm-migration = "2.0.4"
serde = "1.0.229"
serde_json = "1.0.154"
serde_norway = "0.9.42"
serde_plain = "1.0.2"
serde_with = "3.24.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
urlencoding = "2.1.3"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = "10.0.2"
uuid = "1.29.2"

[dependencies]
color-eyre = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
entity = { workspace = true }
once_cell = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
bnacore = { workspace = true }
csv = { workspace = true }
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
# Optimize for size instead of speed
opt-level = "z"

# Enable Link-Time Optimization
lto = true

# Use single codegen unit for better optimization
codegen-units = 1

# Strip all symbols from binary
strip = true

# Enable panic abort instead of unwinding
panic = "abort"

# Reduce debug info
debug = false

# Optimize for size in dependencies too
[profile.release.package."*"]
opt-level = "z"
strip = true
