#:schema https://raw.githubusercontent.com/schemathesis/schemathesis/master/src/schemathesis/config/schema.json

# The local server: the Dev_Server, or the release build in CI.
base-url = "http://localhost:3000"

# Report every failure of a scenario, not only the first.
continue-on-failure = true

# Schemathesis 4's defaults, stated so that a new default cannot weaken the run.
[generation]
mode = "all"

[checks]
enabled = true

[phases]
examples.enabled = true
coverage.enabled = true
fuzzing.enabled = true
stateful.enabled = true

[reports]
directory = "schemathesis-report"
junit.enabled = true
html.enabled = true

# Excluded findings, one block per operation, with the reason they are false
# positives (specs/0005-schemathesis/findings.md, section 4).

# A body the schema allows, but a rule of the API rejects with the documented
# 422: a city_id or a fargate_price_id that matches no row, a state that is not
# a US state for a US city, an end_time that is not a date-time (a format is an
# annotation in OpenAPI 3.1, so "" passes the schema). 422 joins the statuses
# that accept valid data; a 400 or a 415 on valid data still fails.
[[operations]]
include-name = "POST /ratings"
checks.positive_data_acceptance.expected-statuses = ["2XX", "3XX", 401, 403, 404, 409, 422, 429, "5XX"]

[[operations]]
include-name = "POST /pipelines/bna"
checks.positive_data_acceptance.expected-statuses = ["2XX", "3XX", 401, 403, 404, 409, 422, 429, "5XX"]

[[operations]]
include-name = "POST /cities"
checks.positive_data_acceptance.expected-statuses = ["2XX", "3XX", 401, 403, 404, 409, 422, 429, "5XX"]

[[operations]]
include-name = "PATCH /pipelines/bna/{pipeline_id}"
checks.positive_data_acceptance.expected-statuses = ["2XX", "3XX", 401, 403, 404, 409, 422, 429, "5XX"]

# A null optional enum or string means "unchanged": the entity wrappers these
# bodies deserialize serialize an unset field as null, so the Lambdas that send
# them may rely on it. The specification cannot say so, because progenitor
# panics on a nullable reference (0.16.0), so the fields are documented
# non-nullable and Schemathesis sends null as invalid data.
[[operations]]
include-name = "PATCH /cities/submissions/{submission_id}"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "PATCH /pipelines/bna/{pipeline_id}"
checks.negative_data_rejection.enabled = false
