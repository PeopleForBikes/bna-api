components:
  schemas:
    APIError:
      type: object
      description: >-
        Single API Error object as described in
        <https://jsonapi.org/format/#error-objects>.
      required:
        - status
        - title
        - details
        - source
      properties:
        details:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence of the
            problem
          example: the entry was not found
        id:
          type: string
          description: A unique identifier for this particular occurrence of the problem.
          example: blfwkg8nvHcEJnQ=
          nullable: true
        source:
          $ref: '#/components/schemas/APIErrorSource'
          description: An object containing references to the primary source of the error.
        status:
          type: string
          description: >-
            The HTTP status code applicable to this problem, expressed as a
            string value.
          example: '404'
        title:
          type: string
          description: A short, human-readable summary of the problem
          example: Item Not Found
    APIErrorSource:
      oneOf:
        - type: object
          description: >-
            The path of the request that caused the error. The error details
            name the invalid field, if any.
          required:
            - pointer
          properties:
            pointer:
              type: string
              description: >-
                The path of the request that caused the error. The error details
                name the invalid field, if any.
          example:
            pointer: /ratings/e6aade5a-b343-120b-dbaa-bd916cd99221
        - type: object
          description: A string indicating which URI query parameter caused the error.
          required:
            - parameter
          properties:
            parameter:
              type: string
              description: A string indicating which URI query parameter caused the error.
          example:
            parameter: include
        - type: object
          description: >-
            A string indicating the name of a single request header which caused
            the error.
          required:
            - header
          properties:
            header:
              type: string
              description: >-
                A string indicating the name of a single request header which
                caused the error.
          example:
            header: Content-Type
      description: |-
        An object containing references to the primary source of the error.

        It includes one of the following members:

          - pointer: the path of the request that caused the error [e.g. "/ratings/1"]. The
            error details name the invalid field, if any.
          - parameter: a string indicating which URI query parameter caused the error.
          - header: a string indicating the name of a single request header which caused the
            error.
    APIErrors:
      type: object
      description: >-
        Error objects MUST be returned as an array keyed by errors in the top
        level of a

        JSON:API document.
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/APIError'
