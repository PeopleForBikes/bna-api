openapi: 3.0.3
info:
  title: BNA REST API
  description: Provides a way to retrieve the BNA results programmatically.
  contact:
    name: The BNA Mechanics team
    url: https://peopleforbikes.github.io/
  version: 1.6.0-alpha.1
servers:
  - url: http://localhost:3000
    description: Local development API
  - url: https://api.staging.bna.peopleforbikes.org
    description: Staging API
  - url: https://api.bna.peopleforbikes.org
    description: Production API
paths:
  /cities:
    get:
      tags:
        - city
      description: Get the details of all cities where an BNA analysis was performed.
      operationId: get_cities
      parameters:
        - name: page
          in: query
          description: >-
            The result page being returned, starting at 1. A page past the last
            one returns an empty list.
          required: false
          schema:
            type: integer
            format: int64
            maximum: 65536
            minimum: 1
          example: 5
        - name: page_size
          in: query
          description: The number of items per page
          required: false
          schema:
            type: integer
            format: int64
            maximum: 100
            minimum: 1
          example: 25
        - name: sort_by
          in: query
          description: Field to sort the cities by
          required: false
          schema:
            type: string
            description: Fields the city lists can be sorted by.
            enum:
              - name
              - country
              - state
              - state_abbrev
              - region
              - fips_code
              - created_at
          example: created_at
        - name: order_direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderDirection'
          example: desc
      responses:
        '200':
          description: Fetches cities
          headers:
            link:
              schema:
                type: string
              description: >-
                Links to the `first`, `prev`, `next`, and `last` pages (RFC
                8288), pointing at the same pages as the `x-` headers and
                keeping the other query parameters.
            x-next-page:
              schema:
                type: integer
              description: >-
                The page after the requested one, at most the last page (1 for
                an empty list). A page past the last one navigates like the last
                page.
            x-page:
              schema:
                type: integer
              description: The requested page, starting at 1.
            x-per-page:
              schema:
                type: integer
              description: The number of items per page.
            x-prev-page:
              schema:
                type: integer
              description: >-
                The page before the requested one, at least 1. A page past the
                last one navigates like the last page.
            x-total:
              schema:
                type: integer
              description: The total number of items.
            x-total-pages:
              schema:
                type: integer
              description: The number of pages holding items, 0 for an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cities'
        '400':
          description: >-
            The request was formatted incorrectly: an invalid path or query
            parameter, or a body that is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrors'
              example:
                errors:
                  - details: the request was formatted incorrectly
                    id: blfwkg8nvHcEJnQ=
                    source:
                      parameter: status
                    status: '400'
                    title: Bad Request
    post:
      tags:
        - city
      description: Create a new city.
      operationId: post_city
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityPost'
        required: true
      responses:
        '201':
          description: Creates a new city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          description: >-
            The request was formatted incorrectly: an invalid path or query
            parameter, or a body that is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrors'
              example:
                errors:
                  - details: the request was formatted incorrectly
                    id: blfwkg8nvHcEJnQ=
                    source:
                      parameter: status
                    status: '400'
                    title: Bad Request
        '409':
          description: The resource already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrors'
              example:
                errors:
                  - details: the resource already exists
                    id: blfwkg8nvHcEJnQ=
                    source:
                      pointer: /cities
                    status: '409'
                    title: Conflict
        '415':
          description: >-
            The request body was not sent with the `application/json` content
            type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrors'
              example:
                errors:
                  - details: 'Expected request with `Content-Type: application/json`'
                    id: blfwkg8nvHcEJnQ=
                    source:
                      header: content-type
                    status: '415'
                    title: Invalid Request Body
        '422':
          description: >-
            The request body is valid JSON, but its content is rejected: a
            missing or mistyped field, or a value that does not exist. `details`
            names the first invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrors'
              example:
                errors:
                  - details: 'the country is not covered by the BNA: Narnia'
                    id: blfwkg8nvHcEJnQ=
                    source:
                      pointer: /cities
                    status: '422'
                    title: Invalid Attribute
